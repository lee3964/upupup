<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAPERBOTS · 模拟交易大厅</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#070b10; --panel:#0c131c; --panel2:#101a26; --line:#1b2a3a; --text:#c9d6e3; --dim:#6b7f94;
  --green:#39ff88; --red:#ff4d6a; --amber:#ffcc4d; --cyan:#4dd9ff; --purple:#b77dff; --orange:#ff9d3d;
  --mono:"JetBrains Mono","Noto Sans Mono CJK SC","Noto Sans Mono","DejaVu Sans Mono","PingFang SC","Microsoft YaHei",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px}
body{background:radial-gradient(1200px 600px at 50% -10%,#0f2233 0%,var(--bg) 60%)}
#app{display:grid;grid-template-rows:34px 78px minmax(0,1fr) 104px;gap:10px;height:100vh;min-height:760px;padding:10px 12px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
.ptitle{font-size:12px;color:var(--dim);letter-spacing:1px;padding:7px 10px 5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ptitle b{color:var(--text);font-weight:600}
/* header */
#hdr{display:flex;align-items:center;gap:18px;padding:0 12px;white-space:nowrap}
#logo{font-weight:800;letter-spacing:2px;color:var(--green);text-shadow:0 0 8px rgba(57,255,136,.6)}
#logo span{color:var(--text);font-weight:600;letter-spacing:1px;margin-left:6px}
.hitem{color:var(--dim)} .hitem b{color:var(--text);margin-left:4px}
.badge{border:1px solid var(--amber);color:var(--amber);padding:1px 6px;border-radius:3px;font-size:11px}
a.hnav{color:var(--cyan);border:1px solid var(--cyan);padding:1px 6px;border-radius:3px;font-size:11px;text-decoration:none;letter-spacing:.3px}
a.hnav:hover{text-decoration:underline}
#live{margin-left:auto;display:flex;gap:14px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);margin-right:5px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
/* kpis */
#kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{padding:10px 14px}
.kpi .k{font-size:12px;color:var(--dim)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:.5px}
.kpi .s{font-size:11px;color:var(--dim);position:absolute;right:12px;bottom:9px}
.up{color:var(--green)} .down{color:var(--red)} .neutral{color:var(--text)}
.kpi::after{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--accent,var(--cyan))}
/* main */
#main{display:grid;grid-template-columns:340px minmax(0,1fr) 460px;gap:10px;min-height:0}
#left,#right{display:grid;gap:10px;min-height:0}
#left{grid-template-rows:230px minmax(0,1fr)}
#right{grid-template-rows:minmax(0,0.7fr) minmax(0,1.65fr)}
#eqsvg{width:100%;height:calc(100% - 30px);display:block}
#log{overflow:hidden;height:calc(100% - 30px);padding:4px 0}
.ev{display:grid;grid-template-columns:56px 84px 1fr;gap:6px;padding:3px 10px;font-size:11.5px;line-height:1.35;border-bottom:1px dashed rgba(27,42,58,.6)}
.ev .t{color:var(--dim)} .ev .b{font-weight:700} .ev .m{color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.ev.err .m{color:var(--red)}
.ev.new{animation:flash 1.2s}
@keyframes flash{from{background:rgba(57,255,136,.18)}to{background:transparent}}
/* floor */
#floorwrap{display:flex;flex-direction:column;min-height:0}
#floor{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#05080c}
#stage{position:relative;aspect-ratio:320/302;height:100%;max-width:100%}
#room{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.ov{position:absolute;pointer-events:none}
.bubble{background:#f4f7fb;color:#0b1520;border:2px solid #0b1520;border-radius:4px;padding:3px 6px 1px;font-size:11px;line-height:1.3;max-width:230px;
  transform:translate(-50%,-100%);max-height:calc(2.6em + 6px);box-shadow:3px 3px 0 rgba(0,0,0,.45);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;transition:opacity .4s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:#0b1520;border-bottom:0}
.bubble.sleep{background:#28323d;color:#9fb0c0;border-color:#465566}
.dlabel{transform:translateX(-50%);font-size:11.5px;white-space:nowrap;padding:1px 6px;border-radius:3px;background:rgba(5,8,12,.75);border:1px solid var(--line)}
.dlabel i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dlabel.sel{border-color:var(--amber);box-shadow:0 0 8px rgba(255,204,77,.6)}
#scrlabel{font-size:12px;color:var(--green);text-shadow:0 0 6px rgba(57,255,136,.5);white-space:nowrap}
#scrlabel .sym{color:#fff;font-weight:700} #scrlabel .w{color:var(--dim)}
#clock{font-size:11px;color:var(--cyan);text-shadow:0 0 5px var(--cyan)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{color:var(--dim);font-weight:500;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel2)}
td{padding:3px 6px;text-align:right;border-bottom:1px solid rgba(27,42,58,.5);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.tbody{overflow:hidden;height:calc(100% - 30px)} #pos.tbody,#pos{overflow-y:auto}
/* Polymarket paper/live compare: larger readable block */
#pos{font-size:12.5px;padding-bottom:6px}
#pos .sect{font-size:12.5px;padding:8px 12px 4px;letter-spacing:.3px}
#pos table{font-size:12.5px}
#pos th{padding:6px 8px}
#pos td{padding:5px 8px}
#pos .empty{font-size:13px;line-height:1.55;padding:6px 12px 8px}
#pos .oc-scroll{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:4px;margin:4px 10px 10px;background:rgba(0,0,0,.18)}
#pos .oc-scroll table{font-size:11.5px}
#pos .oc-scroll th{position:sticky;top:0;z-index:1;background:#0e1824}
#pos .oc-scroll td.oc-side{text-align:left;max-width:168px;white-space:normal;line-height:1.35;vertical-align:top}
#pos .oc-scroll td.oc-mkt{text-align:left;white-space:nowrap}
#pos .oc-scroll .oc-src-p{color:#ffd34d} #pos .oc-scroll .oc-src-p120{color:#e7a4ff} #pos .oc-scroll .oc-src-l{color:#ff7a59}
#pos .oc-hint{color:var(--dim);font-size:11px;padding:0 12px 4px}
.rbar{position:relative;width:84px;height:9px;background:#0a1018;border:1px solid #1d2b3b;display:inline-block;vertical-align:middle}
.rbar .band{position:absolute;top:0;height:100%;background:rgba(57,255,136,.18);border-left:1px solid rgba(57,255,136,.6);border-right:1px solid rgba(57,255,136,.6)}
.rbar .fill{position:absolute;left:0;top:1px;height:5px}
.sbadge{font-size:10px;padding:0 3px;border-radius:2px;border:1px solid;cursor:help} .sbadge.ok{color:var(--green);border-color:rgba(57,255,136,.5)} .sbadge.bad{color:var(--red,#ff4d6a);border-color:#ff4d6a} .sbadge.na{color:var(--dim);border-color:var(--dim)}
.tag{font-size:10.5px;padding:0 4px;border-radius:2px;border:1px solid}
.chain{font-size:9.5px;padding:0 3px;border-radius:2px;margin-left:2px;color:#0b1220;font-weight:700;cursor:help}
.nofomo{font-size:9.5px;padding:0 3px;border-radius:2px;margin-left:2px;color:#ffb347;border:1px dashed #ffb347;cursor:help}
.tag.in{color:var(--green);border-color:var(--green)} .tag.wide{color:var(--orange);border-color:var(--orange)} .tag.narrow{color:var(--cyan);border-color:var(--cyan)} .tag.na{color:var(--dim);border-color:var(--dim)}
.sect{color:var(--dim);font-size:11px;padding:6px 10px 2px}
.empty{color:var(--dim);padding:8px 10px;font-size:12px}
/* bot cards */
#cards{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.card{padding:8px 10px 8px 62px;cursor:pointer;transition:border-color .2s, transform .2s}
.card:hover{border-color:#2d4660}
.card.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset, 0 0 14px rgba(255,204,77,.25)}
.card canvas{position:absolute;left:8px;top:14px;width:46px;height:46px;image-rendering:pixelated}
.card .n{font-weight:700;font-size:13px} .card .n small{color:var(--dim);font-weight:400;margin-left:4px;font-size:11px}
.card .st{font-size:10.5px;margin-top:3px}
.card .la{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.pill{padding:0 5px;border-radius:2px;font-size:10.5px;border:1px solid}
.pill.working{color:var(--green);border-color:var(--green)} .pill.idle{color:var(--cyan);border-color:var(--cyan)}
.pill.sleeping{color:var(--dim);border-color:var(--dim)} .pill.down{color:var(--red);border-color:var(--red)}
#filterhint{color:var(--amber);font-size:11px}
.ptitle b{white-space:nowrap} #floorwrap .ptitle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:12px}
/* narrower screens: give the trading floor (7 desks) more room */
@media (max-width:1500px){ #main{grid-template-columns:280px minmax(0,1fr) 420px} .rbar{width:60px} #cands th,#cands td{padding:3px 4px} }
@media (max-width:1200px){
  #main{grid-template-columns:230px minmax(0,1fr) 360px}
  #hdr{gap:12px} #hdr .hitem:nth-of-type(n+5){display:none}
  .kpi .v{font-size:21px} .kpi{padding:8px 10px} .kpi .s{display:none}
  .rbar{width:56px} th,td{padding:3px 4px}
  .ev{grid-template-columns:54px 66px 1fr;gap:4px;padding:3px 6px}
  #cands th:nth-child(2),#cands td:nth-child(2){display:none}
  #cards{gap:6px} .card{padding:6px 6px 6px 36px} .card canvas{left:4px;top:12px;width:28px;height:28px} .card .n small{display:none}
  #floorwrap .ptitle span{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="hdr" class="panel">
    <div id="logo">▚ PAPERBOTS<span>模拟交易大厅</span></div>
    <a href="compare.html" style="color:var(--cyan);font-size:12px;margin-left:4px">late A/B</a>
    <a href="maker.html" style="color:#2ee6c5;font-size:12px;margin-left:4px">做市</a>
    <span class="badge">纯模拟 · 无真钱</span>
    <span class="badge" id="h-strat" style="border-color:var(--cyan);color:var(--cyan)">策略 -</span>
    <a class="hnav" id="nav-compare" href="compare.html">四系统对比</a>
    <div class="hitem">运行<b id="h-run">-</b></div>
    <div class="hitem">候选<b id="h-cands">-</b></div>
    <div class="hitem">信号<b id="h-sig">-</b></div>
    <div class="hitem">否决<b id="h-veto">-</b></div>
    <div class="hitem">持仓<b id="h-pos">-</b></div>
    <div class="hitem">侧投注<b id="h-bets">-</b></div>
    <div class="hitem">做市<b id="h-pm">-</b></div>
    <div id="live"><span id="h-mode"><span class="dot"></span>实时 · 每 5 秒刷新</span><span class="hitem">SGT<b id="h-clock">--:--:--</b></span></div>
  </div>

  <div id="kpis">
    <div class="panel kpi" style="--accent:var(--cyan)"><div class="k">当前权益</div><div class="v" id="k-eq">-</div><div class="s" id="k-eq-s"></div></div>
    <div class="panel kpi" style="--accent:var(--green)" id="k-pnl-card"><div class="k">总盈亏</div><div class="v" id="k-pnl">-</div><div class="s" id="k-pnl-s"></div></div>
    <div class="panel kpi" style="--accent:var(--purple)"><div class="k">持仓市值</div><div class="v" id="k-pos">-</div><div class="s" id="k-pos-s"></div></div>
    <div class="panel kpi" style="--accent:var(--amber)"><div class="k">胜率</div><div class="v" id="k-win">-</div><div class="s" id="k-win-s"></div></div>
    <div class="panel kpi" style="--accent:var(--orange)"><div class="k">已平仓笔数</div><div class="v" id="k-closed">-</div><div class="s" id="k-closed-s"></div></div>
  </div>

  <div id="main">
    <div id="left">
      <div class="panel"><div class="ptitle"><b>余额曲线</b><span id="eq-range"></span></div><svg id="eqsvg"></svg></div>
      <div class="panel"><div class="ptitle"><b>活动日志</b><span id="filterhint"></span></div><div id="log"></div></div>
    </div>
    <div id="floorwrap" class="panel">
      <div class="ptitle"><b>交易大厅</b><span>9 个 Bot + 看门狗 · 墙幕：最受关注的币 · 气泡 = Bot 最新日志/心跳 · 灰色打盹 = 心跳超时</span></div>
      <div id="floor"><div id="stage"><canvas id="room" width="320" height="302"></canvas><div id="ovs"></div></div></div>
    </div>
    <div id="right">
      <div class="panel"><div class="ptitle"><b>候选币 · 1 小时波动区间</b><span id="band-note"></span></div><div class="tbody" id="cands"></div></div>
      <div class="panel"><div class="ptitle"><b>策略对比（各版本）· 持仓 & 侧投注</b><span id="cash-note"></span></div><div class="tbody" id="pos"></div></div>
    </div>
  </div>

  <div id="cards"></div>
</div>

<script id="embedded-state">/*__STATE__*/</script>
<script src="config.js"></script>
<script src="compare.js"></script>
<script>
"use strict";
const TZ = "Asia/Singapore";
const BOTC = {scanner:"#4dd9ff", signal:"#39ff88", guard:"#ff4d6a", sizer:"#ffcc4d", executor:"#ff9d3d", sidebet:"#b77dff", sniper:"#ff6fb5", pm_maker:"#2ee6c5", pm_late:"#ffd34d", supervisor:"#d7e2ee"};
const KINDZH = {start:"启动", stop:"停止", signal:"信号", veto:"否决", approve:"批准", size:"下单", fill:"成交", close:"平仓", bet:"下注",
  settle:"结算", error:"错误", cancel:"取消", reject:"拒绝", watchdog:"看门狗", scan:"扫描", live:"实时", skip_rr:"跳过", strategy:"策略", exclude:"排除",
  stop_pending:"待确认止损", stop_reset:"止损复位"};
const STZH = {working:"工作中", idle:"待命", sleeping:"心跳超时", down:"进程停止"};
let S = null, selected = null, frame = 0, lastEventTs = 0;
const $ = id => document.getElementById(id);
const fmt$ = (v, d=2) => (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtPx = v => v == null ? "-" : (v >= 1 ? v.toFixed(4) : v.toPrecision(4));
const fmtM = v => v >= 1e9 ? (v/1e9).toFixed(2)+"B" : v >= 1e6 ? (v/1e6).toFixed(1)+"M" : (v/1e3).toFixed(0)+"K";
const tsg = (ts, sec=true) => new Date(ts*1000).toLocaleTimeString("zh-CN", {timeZone:TZ, hour12:false, hour:"2-digit", minute:"2-digit", second: sec ? "2-digit" : undefined});
const ago = s => s == null ? "-" : s < 60 ? Math.round(s)+"秒前" : s < 3600 ? Math.round(s/60)+"分钟前" : (s/3600).toFixed(1)+"小时前";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur = s => { s = Math.max(0, s|0); const d = s/86400|0, h = (s%86400)/3600|0, m = (s%3600)/60|0; return (d ? d+"天" : "") + (d||h ? h+"小时" : "") + m+"分"; };

/* ------------------------------------------------------------------ pixel art */
const W = 320, H = 302;
const cv = $("room"), cx = cv.getContext("2d");
function px(x, y, w, h, c){ cx.fillStyle = c; cx.fillRect(x|0, y|0, w, h); }
function drawRows(ctx, rows, pal, x, y, s=1, flip=false){
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++){
    const k = rows[r][flip ? rows[r].length-1-c : c]; if (k === "." || !(k in pal)) continue;
    ctx.fillStyle = pal[k]; ctx.fillRect(x + c*s, y + r*s, s, s);
  }
}
const HEAD = ["...hhhhhh...","..hhhhhhhh..","..hssssssh..","..sesssses..","..ssssssss..","...ssmmss...","....ssss...."];
const TORSO = ["..cccccccc..",".cccccccccc.",".cccccccccc.",".cccccccccc."];
// accessories: [rows, dx, dy] drawn on top of head (dy relative to head top, in sprite px)
const ACC = {
  scanner: {rows:["..GGGGGGGG..","..GggGGggG.."], dy:2},                    // cyan goggles
  signal:  {rows:["..KKKKKKKK..",".K........K.",".K........K.",".K........K.",".K.......KK.","..........L."], dy:-1}, // headset + mic
  guard:   {rows:["..RRRRRRRR..",".RRRRRRRRRR.",".RrrrrrrrrR."], dy:-1},     // helmet w/ visor stripe
  sizer:   {rows:["..WWW..WWW..","..W.WWWW.W..","..WWW..WWW.."], dy:2},     // round glasses
  executor:{rows:["..OOOOOOOO..",".OOOOOOOOOOoo"], dy:-1},                   // cap with brim
  sidebet: {rows:["...PPPPPP...","...PPPPPP...","...PPPPPP...","...YYYYYY...",".PPPPPPPPPP."], dy:-4}, // top hat
  sniper:  {rows:["...BBBBBB...","..BBBBBBBB..","..bbbbbbbb..","BBBBBBBBBBBB"], dy:-3},  // detective fedora with pink band
  pm_maker:{rows:["..VVVVVVVV..",".VVVVVVVVVV.","VvvvvvvvvvvV"], dy:0},   // translucent green dealer's visor (pit trader)
  pm_late: {rows:["..AAAAAAAA..",".AAAAAAAAAA.","AaaaaaaaaaaA"], dy:-1},   // gold racing cap: the "last-minute sprinter"
};
const CHEST = { pm_late:[[5,7,"W"],[6,7,"W"],[4,8,"W"],[7,8,"W"],[5,9,"W"],[6,9,"W"]], pm_maker:[[2,7,"J"],[9,7,"J"],[5,7,"T"],[6,7,"T"],[5,8,"T"],[6,8,"T"],[5,9,"T"],[3,9,"Q"],[8,9,"Q"]], sniper:[[2,7,"k"],[9,7,"k"],[3,8,"k"],[8,8,"k"],[5,9,"b"],[6,9,"b"]], guard:[[5,8,"Y"],[6,8,"Y"]], sizer:[[5,7,"T"],[6,7,"T"],[5,8,"T"],[6,8,"T"],[5,9,"T"]], scanner:[[3,8,"g"]], signal:[[8,8,"L"]] };
const PAL = {
  scanner: {h:"#1b1b22", s:"#f1c27d", e:"#111", m:"#a0522d", c:"#1f6f8b", G:"#1d2630", g:"#4dd9ff"},
  signal:  {h:"#6b3e26", s:"#e0ac69", e:"#111", m:"#8b4513", c:"#1d8a4c", K:"#2a2f36", L:"#39ff88"},
  guard:   {h:"#333",    s:"#c68642", e:"#111", m:"#6b2b14", c:"#30343f", R:"#d93a50", r:"#ffd1d8", Y:"#ffcc4d"},
  sizer:   {h:"#cfd3d6", s:"#f5d0a9", e:"#111", m:"#b5651d", c:"#b8922a", W:"#e9eef2", T:"#7a1f2b"},
  executor:{h:"#111",    s:"#8d5524", e:"#000", m:"#4a2511", c:"#cf5f22", O:"#ff9d3d", o:"#a85516"},
  sidebet: {h:"#9c4a4a", s:"#f1c27d", e:"#111", m:"#a0522d", c:"#5b3a8c", P:"#2b1d40", Y:"#b77dff"},
  sniper:  {h:"#3b2a1a", s:"#d9a066", e:"#111", m:"#8b4513", c:"#b5835a", B:"#4a3626", b:"#ff6fb5", k:"#8a6142"},  // tan trench coat, brown fedora
  pm_late: {h:"#5a3a1a", s:"#f0c8a0", e:"#111", m:"#9a4f2a", c:"#3a2f6b", A:"#ffd34d", a:"#ff9d3d", W:"#f4f7fb"},  // indigo jacket, stopwatch on chest
  pm_maker:{h:"#2a2a2a", s:"#eac096", e:"#111", m:"#9a4f2a", c:"#1f5f5a", V:"#2ee6c5", v:"#a9fff0", J:"#ffcc4d", T:"#c9d6e3", Q:"#0f3b38"},  // teal pit jacket, gold piping
};
function grey(p){ const o = {}; for (const k in p){ const c = p[k]; const n = parseInt(c.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255; let v = (0.3*r+0.59*g+0.11*b)*0.55 + 20 | 0; o[k] = `rgb(${v},${v+3},${v+8})`; } return o; }
// draw a seated character; returns head top y (canvas px). scale s
function drawChar(ctx, key, x, y, s, st, f){

function drawScreenChart(x0, y0, w, h){

    const stZh = s => s==="settled"?"已结算":s==="open"?"持仓":s==="missed"?"没吃到":s==="error"?"下单异常":(s||"—");
    const mkt = (slug, asset, dur) => {
      const base = (slug||"").replace("-updown-", " ").replace(/-\d+$/, "");
      const d = dur ? `${Math.round(dur/60)}m` : "";
      return esc((base || (asset||"").toUpperCase()) + (d && !base.includes(d) ? ` ${d}` : ""));
    };
    const sideCell = o => {
      if (!o) return `<td class="oc-side" style="color:#6b7f94">—</td>`;
      const px = o.fill_px == null ? "—" : Number(o.fill_px).toFixed(2);
      const cost = o.cost == null ? "" : fmt$(o.cost);
      const pnlHtml = o.pnl == null ? "" : `<span class="${o.pnl>=0?"up":"down"}">${o.pnl>=0?"+":""}${fmt$(o.pnl)}</span>`;
      const note = o.note ? esc(o.note) : "";
      const edge = o.edge != null ? ` edge ${(o.edge*100).toFixed(1)}¢` : "";
      return `<td class="oc-side" title="${note}${edge}"><b>${esc(o.side||"")}</b> · ${stZh(o.status)}` +
        `<br>${px}${cost ? " · "+cost : ""}${pnlHtml ? " · "+pnlHtml : ""}` +
        `${note ? `<br><span style="color:#6b7f94">${note.length>28?note.slice(0,28)+"…":note}</span>` : ""}</td>`;
    };
    const nBoth = LOC.n_aligned_both != null ? LOC.n_aligned_both : (LOC.aligned||[]).filter(e => e.paper && e.live).length;
    hs += `<div class="sect" style="color:#c9d6e3">订单明细对比（按市场对齐 · 模拟 ${esc(LOC.paper_version||"late-v1")} vs 实盘 ${esc(LOC.live_version||"live-late-v1")}）</div>` +
      `<div class="oc-hint">同 slug 并排 · 双侧对齐 ${nBoth} 对 · 近期模拟 ${LOC.n_paper||0} / 实盘 ${LOC.n_live||0} 条 · 悬停看备注</div>` +
      `<div class="oc-scroll"><table><tr><th>到期</th><th>市场</th><th style="color:#ffd34d">模拟</th><th style="color:#ff7a59">实盘</th></tr>` +
      (LOC.aligned||[]).map(e => {
        const t = e.end_ts || (e.paper&&e.paper.ts) || (e.live&&e.live.ts);
        return `<tr><td>${t?tsg(t,false):"—"}</td><td class="oc-mkt">${mkt(e.slug,e.asset,e.dur_s)}</td>${sideCell(e.paper)}${sideCell(e.live)}</tr>`;
      }).join("") + `</table></div>`;
    if (LOC.timeline && LOC.timeline.length){
      hs += `<div class="sect" style="color:#c9d6e3">订单时间线（按触发时间 · paper|live）</div>` +
        `<div class="oc-scroll" style="max-height:220px"><table><tr><th>时间</th><th>来源</th><th>市场</th><th>方向</th><th>状态</th><th>成交价</th><th>成本</th><th>盈亏</th></tr>` +
        LOC.timeline.map(r => {
          const d = window.PBCompare ? PBCompare.describeSrc(r) : null;
          const src = d
            ? `<span class="${d.kind === "live" ? "oc-src-l" : d.kind === "paper120" ? "oc-src-p120" : d.kind === "paper" ? "oc-src-p" : ""}">${esc(d.text || "—")}</span>`
            : (r.src === "live" ? `<span class="oc-src-l">实盘</span>` : `<span class="oc-src-p">${esc(r.version || r.src || "模拟")}</span>`);
          const pnl = r.pnl == null ? "—" : `<span class="${r.pnl>=0?"up":"down"}">${r.pnl>=0?"+":""}${fmt$(r.pnl)}</span>`;
          return `<tr title="${esc(r.note||"")}"><td>${r.ts!=null?tsg(r.ts,false):"—"}</td><td>${src}</td><td class="oc-mkt">${mkt(r.slug,r.asset,r.dur_s)}</td>` +
            `<td>${esc(r.side||"")}</td><td>${stZh(r.status)}</td><td>${r.fill_px==null?"—":Number(r.fill_px).toFixed(2)}</td>` +
            `<td>${r.cost==null?"—":fmt$(r.cost)}</td><td>${pnl}</td></tr>`;
        }).join("") + `</table></div>`;
    }
  }
  const vs = (S.strategy||{}).stats || {}, cur = (S.strategy||{}).version;
  const cellV = (v, f) => vs[v] ? f(vs[v]) : "—";
  const rows = [["信号", d => d.signals], ["盈亏比跳过", d => d.rr_skips], ["否决", d => d.vetoes], ["平仓", d => d.closed],
    ["胜率", d => d.win_rate == null ? "—" : d.win_rate.toFixed(0) + "%"],
    ["盈亏", d => `<span class="${d.pnl>=0?"up":"down"}">${d.pnl>=0?"+":""}${fmt$(d.pnl)}</span>`],
    ["每笔均", d => d.avg_pnl_pct == null ? "—" : `${d.avg_pnl_pct>=0?"+":""}${d.avg_pnl_pct.toFixed(2)}%`]];
  hs += `<div class="sect">币策略版本对比</div><table><tr><th>策略</th>${rows.map(r => `<th>${r[0]}</th>`).join("")}</tr>` + Object.keys(vs).map(v =>
    `<tr><td style="color:${v===cur?"#4dd9ff":"#c9d6e3"};font-weight:${v===cur?700:400}">${v}${v===cur?" ◀当前":""}</td>${rows.map(r => `<td>${cellV(v, r[1])}</td>`).join("")}</tr>`).join("") + `</table>`;
  const P = S.pm;

  if (P){
    const c = v => v == null ? "—" : `<span class="${v>=0?"up":"down"}">${v>=0?"+":""}${(v*100).toFixed(1)}¢</span>`;
    const L = P.lat || {};
    hs += `<div class="sect" style="color:#2ee6c5">Polymarket 做市 v1（已结束 · 报价关闭 · 原 $${P.budget} 预算）${P.halted ? ' <span class="down">⛔ 今日已停</span>' : ""}</div>` +
      `<div class="empty" style="padding-top:0;line-height:1.5">挂单 ${P.quotes} 次 · 虚拟成交 ${P.fills} 笔 / ${P.shares.toFixed(0)} 股 · 已结算 ${P.settled} 盘 ` +
      `<span class="${P.pnl>=0?"up":"down"}">${P.pnl>=0?"+":""}${fmt$(P.pnl)}</span>（返佣估 ${fmt$(P.rebate)}）· 未结算估值 ${fmt$(P.open_mark)}<br>` +
      `每股 markout：1秒 ${c(P.mo1)} · 10秒 ${c(P.mo10)} · 60秒 ${c(P.mo60)} · 撤改单延迟 ${L.requote ? Math.round(L.requote) + "ms" : "—"} · WS ${L.ws_pm ? "通" : "断"}</div>`;
    if (P.open.length) hs += `<table><tr><th>盘口</th><th>剩余</th><th>模型</th><th>中间价</th><th>库存</th><th>估值</th></tr>` + P.open.slice(0,4).map(r =>
      `<tr><td>${r.asset.toUpperCase()} ${r.dur_s/60}分 ${tsg(r.end_ts,false)}</td><td>${Math.max(0, Math.round(r.end_ts - S.generated))}s</td><td>${r.last_fair==null?"-":r.last_fair.toFixed(2)}</td><td>${r.last_mid==null?"-":r.last_mid.toFixed(3)}</td>` +
      `<td>${(r.net_shares||0)>=0?"+":""}${(r.net_shares||0).toFixed(0)}</td><td class="${r.mark>=0?"up":"down"}">${r.mark>=0?"+":""}${fmt$(r.mark)}</td></tr>`).join("") + `</table>`;
  }
  hs += `<div class="sect">币仓位（最多 1 个）</div>`;
  if (S.positions.length) hs += `<table><tr><th>币</th><th>入场</th><th>现价</th><th>投入</th><th>浮盈亏</th></tr>` + S.positions.map(p =>
    `<tr><td>${esc(p.symbol)}</td><td>${fmtPx(p.entry_mkt_price)}</td><td>${fmtPx(p.last_price)}</td><td>${fmt$(p.cost_usd)}</td><td class="${p.unreal>=0?"up":"down"}">${p.unreal>=0?"+":""}${fmt$(p.unreal)}</td></tr>`).join("") + `</table>`;
  else hs += `<div class="empty">空仓 — 等待横盘底部信号</div>`;
  hs += `<div class="sect">Polymarket 侧投注（实验性）</div>`;
  if (S.bets.length) hs += `<table><tr><th>市场 / 押注</th><th>入场</th><th>现价</th><th>本金</th><th>盈亏</th></tr>` + S.bets.map(b =>
    `<tr><td title="${esc(b.question)}" style="max-width:170px;overflow:hidden;text-overflow:ellipsis">${esc(b.outcome)} · ${esc(b.question)}</td><td>${b.entry_price.toFixed(3)}</td><td>${b.cur.toFixed(3)}</td><td>${fmt$(b.stake_usd)}</td>` +
    `<td class="${b.unreal>=0?"up":"down"}">${b.unreal>=0?"+":""}${fmt$(b.unreal)}${b.status==="settled"?" ✓":""}</td></tr>`).join("") + `</table>`;
  else hs += `<div class="empty">暂无侧投注</div>`;
  if (S.closed.length) hs += `<div class="sect">最近平仓</div><table>` + S.closed.slice(0,4).map(c => `<tr><td>${esc(c.strategy_version||"v1")} ${esc(c.symbol)}</td><td>${tsg(c.close_ts,false)}</td><td>${c.exit_reason}</td><td class="${c.pnl_usd>=0?"up":"down"}">${fmt$(c.pnl_usd)}</td></tr>`).join("") + `</table>`;
  $("pos").innerHTML = hs;
}
const cardCtx = {};
function renderCards(){
  const box = $("cards");
  if (!box.children.length){
    S.bots.forEach(b => { const d = document.createElement("div"); d.className = "panel card"; d.dataset.key = b.key;
      d.innerHTML = `<canvas width="24" height="24"></canvas><div class="n"></div><div class="st"></div><div class="la"></div>`;
      d.onclick = () => { selected = selected === b.key ? null : b.key; render(); }; box.appendChild(d); cardCtx[b.key] = d.querySelector("canvas").getContext("2d"); });
  }
  S.bots.forEach(b => { const d = box.querySelector(`[data-key="${b.key}"]`); if (!d) return;
    d.classList.toggle("sel", selected === b.key);
    d.querySelector(".n").innerHTML = `<span style="color:${BOTC[b.key]}">${b.zh}</span><small>${b.key}</small>`;
    d.querySelector(".st").innerHTML = `<span class="pill ${b.status}">${STZH[b.status]}</span> <span style="color:#6b7f94">心跳 ${b.key==="supervisor" ? (b.alive?"进程在线":"—") : ago(b.hb_age)}</span>`;
    d.querySelector(".la").textContent = b.say || b.role;
    d.title = b.role;
  });
}
function drawCards(){
  if (!S) return;
  S.bots.forEach(b => { const c = cardCtx[b.key]; if (!c) return; c.clearRect(0,0,24,24);
    if (b.key === "supervisor"){ drawRows(c, b.alive ? (((frame>>2)%2)?DOG:DOG2) : DOGSLEEP, b.alive?DOGPAL:grey(DOGPAL), 4, 9, 1); return; }
    const pal0 = PAL[b.key]; const st = b.status;
    let pal = (st==="sleeping"||st==="down") ? grey(pal0) : pal0;
    const bob = st === "idle" ? ((frame >> 3) % 2) : (st === "working" ? ((frame >> 1) % 2) : 0);
    drawRows(c, TORSO, pal, 6, 15, 1); drawRows(c, HEAD, pal, 6, 8 + bob, 1); const a = ACC[b.key]; if (a) drawRows(c, a.rows, pal, 6, 8 + bob + a.dy, 1);
  });
}

/* ------------------------------------------------------------------ loop */
function tick(){ drawRoom(); drawCards(); $("h-clock").textContent = new Date().toLocaleTimeString("zh-CN", {timeZone:TZ, hour12:false}); }
let FAILS = 0, POLLING = false;
const _qs = new URLSearchParams(location.search);
if (_qs.get("k")) try { localStorage.setItem("pb_floor_k", _qs.get("k")); } catch(_){}
const FLOOR_TOKEN = _qs.get("k") || (function(){ try { return localStorage.getItem("pb_floor_k") || ""; } catch(_){ return ""; } })();
const FLOOR_API = String(window.FLOOR_API || _qs.get("api") || "").replace(/\/$/, "");
(function(){
  const a = $("nav-compare");
  if (!a) return;
  const q = new URLSearchParams(location.search);
  if (!q.get("k") && FLOOR_TOKEN) q.set("k", FLOOR_TOKEN);
  const s = q.toString();
  if (s) a.search = "?" + s;
})();
function setMode(html){ $("h-mode").innerHTML = html; }
function stateUrl(){
  const abs = FLOOR_API ? (FLOOR_API + "/api/state") : "api/state";
  const q = new URLSearchParams(); q.set("_", String(Date.now()));
  if (FLOOR_TOKEN) q.set("k", FLOOR_TOKEN);
  return abs + "?" + q.toString();
}
async function poll(){
  if (POLLING) return; POLLING = true;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 8000);
  try {
    if (FLOOR_API && !FLOOR_TOKEN) {
      setMode(`<span style="color:#ff4d6a">● 缺少访问令牌：请用 ?k=你的令牌 打开一次</span>`);
      FAILS++; return;
    }
    const r = await fetch(stateUrl(), {
      cache: "no-store",
      credentials: FLOOR_API ? "omit" : "same-origin",
      signal: ctl.signal
    });
    if (r.status === 403) { FAILS++; setMode(`<span style="color:#ff4d6a">● 访问令牌失效，请用带 ?k= 的链接重新打开</span>`); }
    else if (!r.ok) { throw new Error("HTTP " + r.status); }
    else {
      const data = await r.json(); S = data; FAILS = 0;
      try { render(); } catch(re) { console.error("render error", re); }
      setMode(`<span class="dot"></span>实时 · 每 5 秒刷新` + (FLOOR_API ? ` · 远程` : ""));
    }
  } catch(e) {
    FAILS++; console.warn("poll failed", e);
    setMode(`<span style="color:#ff4d6a">● 连接中断，重试中…（${FAILS}）</span>`);
    if (FAILS >= 6) { location.reload(); }
  } finally { clearTimeout(to); POLLING = false; }
}
// Live remote (GitHub Pages) always polls; embedded snapshot only when no FLOOR_API.
if (FLOOR_API) { poll(); setInterval(poll, 5000); }
else if (window.__STATE__){ S = window.__STATE__; $("h-mode").innerHTML = `<span style="color:#ffcc4d">■ 快照 ${new Date(S.generated*1000).toLocaleString("zh-CN",{timeZone:TZ,hour12:false})} SGT</span>`; render(); }
else { poll(); setInterval(poll, 5000); }
setInterval(tick, 100);
window.addEventListener("resize", () => S && renderEquity());
</script>
